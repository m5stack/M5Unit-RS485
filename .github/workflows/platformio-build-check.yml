name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        example:
          - Transceiver

        unit:
          - UnitRS485

        board:
        # Reduced to the 5 distinct compile configs (toolchain x chip arch). The rest differ only in
        # pins_arduino.h, so the library compiles identically; the wiring paths they used to cover are
        # include entries below. Commented out rather than deleted, per the family convention.
          - Core
#          - Core2  # ESP32: represented by Core
          - CoreS3
#          - Fire  # ESP32: represented by Core
#          - StampS3  # ESP32-S3: represented by CoreS3
#          - Dial  # ESP32-S3: represented by CoreS3 (same board id as StampS3)
#          - Atom  # ESP32: represented by Core (the Atomic base path is an include entry below)
#          - AtomS3  # ESP32-S3: represented by CoreS3 (the Atomic base path is an include entry below)
#          - AtomS3R  # ESP32-S3: represented by CoreS3
          - NanoC6
          - NanoH2
#          - StickCPlus  # ESP32: represented by Core (the Hat path is an include entry below)
#          - StickCPlus2  # ESP32: represented by Core (the Hat path is an include entry below)
#          - StickS3  # ESP32-S3: represented by CoreS3 (the Hat path is an include entry below)
#          - Paper  # ESP32: represented by Core (same board id as Fire)
#          - CoreInk  # ESP32: represented by Core
#          - Cardputer  # ESP32-S3: represented by CoreS3 (same board id as StickS3)
          - Tab5
#          - NessoN1  # ESP32-C6: represented by NanoC6 (the Hat/LP-I2C path is an include entry below)

        framework:
          - Arduino

        espressif32:
          - latest

        include:
        # HAT
          - example: Transceiver
            unit: 'HatRS485'
            board: StickCPlus
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'HatRS485'
            board: StickCPlus2
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'HatRS485'
            board: CoreInk
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'HatRS485'
            board: StickS3
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'HatRS485'
            board: NessoN1
            framework: Arduino
            espressif32: latest
          # AtomicBase
          - example: Transceiver
            unit: 'AtomicRS485Base'
            board: Atom
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'AtomicRS485Base'
            board: AtomS3
            framework: Arduino
            espressif32: latest
          - example: Transceiver
            unit: 'AtomicRS485Base'
            board: AtomS3R
            framework: Arduino
            espressif32: latest
          # BuiltinRS485 (Tab5 built-in SIT3088)
          - example: Transceiver
            unit: 'BuiltinRS485'
            board: Tab5
            framework: Arduino
            espressif32: latest
          # StreamAdapter: secondary example (Arduino only, demonstrates UnitSP485Stream).
          # The Stream usage is variant-independent, but the example's own #if branches are
          # mutually exclusive, so one job per variant is what compiles them at all. One board
          # each: the variant decides the form factor (Hat = StickC, Atomic = Atom, built-in = Tab5).
          - example: StreamAdapter
            unit: 'UnitRS485'
            board: Core
            framework: Arduino
            espressif32: latest
          - example: StreamAdapter
            unit: 'HatRS485'
            board: StickCPlus2
            framework: Arduino
            espressif32: latest
          - example: StreamAdapter
            unit: 'AtomicRS485Base'
            board: AtomS3
            framework: Arduino
            espressif32: latest
          - example: StreamAdapter
            unit: 'BuiltinRS485'
            board: Tab5
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
