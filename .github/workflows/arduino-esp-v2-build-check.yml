name: Build(arduino-esp32:2.x)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-esp-v2-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        platform-url:
          - https://espressif.github.io/arduino-esp32/package_esp32_index.json

        sketch:
          - Transceiver

        build-properties:
          - "-DUSING_UNIT_RS485"

        board:
          - m5stack-atom
          - m5stack-atoms3
          - m5stack-core-esp32
          - m5stack-core2
          - m5stack-coreink
          - m5stack-cores3
          - m5stack-fire

        platform-version:
          - 2.0.17

        platform:
          - esp32

        archi:
          - esp32

        include:
          # The Transceiver variants: the example's #if branches are mutually exclusive, so each
          # needs its own job to be compiled at all, and core 2.0.17 is the only place they would
          # otherwise go unbuilt (the 3.x workflows cover them). The board follows the variant's
          # form factor. Tab5 is absent on purpose: it is an ESP32-P4, which this core predates.
          - sketch: Transceiver
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 2.0.17
            platform: esp32
            archi: esp32
            board: m5stack-coreink
            build-properties: "-DUSING_HAT_RS485"
          - sketch: Transceiver
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 2.0.17
            platform: esp32
            archi: esp32
            board: m5stack-atom
            build-properties: "-DUSING_ATOMIC_RS485_BASE"
          # StreamAdapter: secondary example (Arduino only, demonstrates UnitSP485Stream).
          # The Stream usage is variant-independent, but the example's own #if branches are not,
          # so each variant needs its own job. Tab5 is absent: it is an ESP32-P4, which this core
          # predates.
          - sketch: StreamAdapter
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 2.0.17
            platform: esp32
            archi: esp32
            board: m5stack-core-esp32
            build-properties: "-DUSING_UNIT_RS485"
          - sketch: StreamAdapter
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 2.0.17
            platform: esp32
            archi: esp32
            board: m5stack-coreink
            build-properties: "-DUSING_HAT_RS485"
          - sketch: StreamAdapter
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            platform-version: 2.0.17
            platform: esp32
            archi: esp32
            board: m5stack-atom
            build-properties: "-DUSING_ATOMIC_RS485_BASE"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.sketch }}
          cli-compile-flags: |
            - --build-property
            - build.extra_flags=${{ matrix.build-properties }}
